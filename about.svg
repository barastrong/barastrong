<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="About Bara"><title>About Bara</title><desc>Backend developer working on web applications, learning Laravel, MySQL, Node.js and software architecture.</desc><defs></defs><style></style><rect x=".75" y=".75" width="898.5" height="358.5" rx="18" fill="#1D1839" stroke="#3B3370" stroke-width="1.5"/><text x="44" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#F7E9DC">About</text><rect x="44" y="56" width="36" height="3" rx="1.5" fill="#FFB27A"/><text x="44" y="100" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" fill="#F7E9DC">I'm Bara, a backend developer. I build web applications with Laravel,</text><text x="44" y="128" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" fill="#F7E9DC">Next.js and Supabase, and I try to write code that is still easy to read</text><text x="44" y="156" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" fill="#F7E9DC">six months later. My best work happens with lofi playing and a strong coffee.</text><rect x="44" y="186" width="812" height="1" fill="#3B3370"/><text x="44" y="206" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#FFB27A">Working on</text><text x="260" y="206" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#F7E9DC">backend web applications</text><rect x="44" y="216" width="812" height="1" fill="#3B3370"/><text x="44" y="236" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#FFB27A">Learning</text><text x="260" y="236" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#F7E9DC">Laravel, MySQL, Node.js, software architecture</text><rect x="44" y="246" width="812" height="1" fill="#3B3370"/><text x="44" y="266" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#FFB27A">Looking for guidance on</text><text x="260" y="266" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#F7E9DC">clean code and system design</text><rect x="44" y="276" width="812" height="1" fill="#3B3370"/><text x="44" y="296" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#FFB27A">Open to</text><text x="260" y="296" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#F7E9DC">open-source collaboration and new ideas</text><rect x="44" y="306" width="812" height="1" fill="#3B3370"/><text x="44" y="326" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#FFB27A">Ask me about</text><text x="260" y="326" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#F7E9DC">Laravel, JavaScript, Firebase integration</text></svg>