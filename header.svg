<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Bintang Bara Adyasta, backend developer</title>
  <desc id="d">Blueprint-style drawing: a client sends a request to an API, the API queries a database, and a 200 OK response returns.</desc>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#F4F7FF" stroke-opacity=".10"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#F4F7FF" stroke-opacity=".18"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#F4F7FF"/>
    </marker>
  </defs>
  <style>
    text{font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace}
    .dot{fill:#FFD23F;animation:go 4s linear infinite backwards}
    .d2{animation-delay:1.6s}
    @keyframes go{
      0%{transform:translateX(0);opacity:0}
      5%{opacity:1}
      35%{transform:translateX(167px);opacity:1}
      40%,100%{transform:translateX(167px);opacity:0}
    }
    @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>

  <rect width="900" height="340" fill="#17358F"/>
  <rect width="900" height="340" fill="url(#minor)"/>
  <rect width="900" height="340" fill="url(#major)"/>
  <rect x="12" y="12" width="876" height="316" fill="none" stroke="#F4F7FF" stroke-width="2"/>
  <rect x="20" y="20" width="860" height="300" fill="none" stroke="#F4F7FF" stroke-opacity=".5"/>

  <text x="48" y="96" font-size="46" font-weight="700" fill="#F4F7FF">Bintang Bara Adyasta</text>
  <text x="48" y="134" font-size="22" fill="#9CC7FF">Backend developer</text>
  <text x="48" y="164" font-size="15" fill="#DCE8FF">Web applications with clean, reliable backends.</text>

  <g fill="#17358F" stroke="#F4F7FF" stroke-width="2">
    <rect x="48" y="200" width="150" height="56"/>
    <rect x="365" y="200" width="170" height="56"/>
    <rect x="702" y="200" width="150" height="56"/>
  </g>
  <g fill="#F4F7FF" text-anchor="middle">
    <text x="123" y="224" font-size="17" font-weight="700">Client</text>
    <text x="123" y="243" font-size="12" fill="#9CC7FF">browser, app</text>
    <text x="450" y="224" font-size="17" font-weight="700">API</text>
    <text x="450" y="243" font-size="12" fill="#9CC7FF">Laravel, Node.js</text>
    <text x="777" y="224" font-size="17" font-weight="700">MySQL</text>
    <text x="777" y="243" font-size="12" fill="#9CC7FF">MongoDB, Firebase</text>
  </g>

  <g stroke="#F4F7FF" stroke-width="1.5" fill="none">
    <path d="M198 222H363" marker-end="url(#arr)"/>
    <path d="M535 222H700" marker-end="url(#arr)"/>
    <path d="M365 240H200" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <path d="M702 240H537" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" fill="#9CC7FF" text-anchor="middle">
    <text x="281" y="214">request</text>
    <text x="618" y="214">query</text>
    <text x="281" y="256">response</text>
    <text x="618" y="256">rows</text>
  </g>
  <circle class="dot" cx="198" cy="222" r="5"/>
  <circle class="dot d2" cx="535" cy="222" r="5"/>

  <circle cx="54" cy="291" r="5" fill="#FFD23F"/>
  <text x="68" y="296" font-size="16" font-weight="700" fill="#FFD23F">200 OK</text>

  <g fill="none" stroke="#F4F7FF">
    <rect x="560" y="284" width="300" height="36"/>
    <path d="M700 284V320"/>
  </g>
  <text x="574" y="307" font-size="12" fill="#F4F7FF">Drawn by Bara</text>
  <text x="714" y="307" font-size="12" fill="#F4F7FF">Rev. 2026.10</text>
</svg>
